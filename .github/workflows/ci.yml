name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev
      - run: npm run test:package
      - name: Record development-only upstream findings
        continue-on-error: true
        run: npm audit --json > development-dependency-audit.json
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: exchange-package-node-${{ matrix.node }}
          path: |
            *.tgz
            development-dependency-audit.json
